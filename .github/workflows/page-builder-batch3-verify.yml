name: Page builder batch 3 verification

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Lint batch 3
        run: npx eslint src/blocks src/lib/page-blocks src/collections/Pages.ts src/payload.config.ts
      - name: Turbopack production build
        run: npm run build
        env:
          PAYLOAD_SECRET: page-builder-batch3-verification
