name: Sync SoftwarePartners Payload types

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/software-partners-sync-types.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm run generate:types
      - name: Commit generated Payload types
        run: |
          if git diff --quiet -- src/payload-types.ts; then
            echo "Payload types already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payload-types.ts
          git commit -m "Regenerate Payload types for SoftwarePartners"
          git push origin HEAD:main

# sync-v3
