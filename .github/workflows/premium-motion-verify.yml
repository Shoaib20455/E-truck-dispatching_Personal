name: Premium motion verification

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Turbopack production build
        run: npm run build
        env:
          PAYLOAD_SECRET: premium-motion-check
