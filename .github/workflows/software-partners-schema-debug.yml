name: Debug SoftwarePartners schema

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/software-partners-schema-debug.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Show registered blocks
        run: |
          grep -n "SoftwarePartners" src/blocks/index.ts || true
          node --import tsx -e "import('./src/blocks/index.ts').then(m => console.log(m.pageBlocks.map(b => b.slug).join(',')))"
      - run: npm run generate:types
      - name: Check generated type
        run: |
          grep -n "softwarePartners" src/payload-types.ts || true
          grep -n "nationwideBilling" src/payload-types.ts | head
