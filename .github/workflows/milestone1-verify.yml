name: Milestone 1 verification

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Turbopack production build
        run: npm run build
        env:
          PAYLOAD_SECRET: milestone-1-build-check
      - name: Turbopack bundle analysis
        run: npm run analyze
        env:
          PAYLOAD_SECRET: milestone-1-analyze-check
      - name: Report analysis size
        run: |
          du -sh .next/diagnostics/analyze || true
          find .next/diagnostics/analyze -type f | wc -l || true
