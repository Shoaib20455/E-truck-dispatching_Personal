name: Generate Next 16.3.6 upgrade

on:
  push:
    branches:
      - next-16-3-6-upgrade

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message != 'Upgrade Next.js to 16.3.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - name: Upgrade framework packages
        run: npm install --save-exact next@16.3.6 eslint-config-next@16.3.6
      - run: npx tsc --noEmit
      - name: Verify Turbopack build
        run: npm run build
        env:
          PAYLOAD_SECRET: next-upgrade-check
      - name: Verify bundle analyzer
        run: npm run analyze
        env:
          PAYLOAD_SECRET: next-upgrade-analyze
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Upgrade Next.js to 16.3.6"
          git push origin HEAD:next-16-3-6-upgrade
