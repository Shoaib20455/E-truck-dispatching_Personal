name: Blog Payload verification

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Lint blog integration
        run: npx eslint "src/app/(app)/blog" "src/app/(app)/Components/BlogDetailLayout.tsx" "src/app/(app)/Components/AuthorCard.tsx" "src/lib/payload-data.ts" "src/lib/schemas/article.ts"
      - name: Turbopack production build
        run: npm run build
        env:
          PAYLOAD_SECRET: blog-payload-verification
