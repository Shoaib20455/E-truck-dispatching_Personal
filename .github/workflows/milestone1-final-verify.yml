name: Milestone 1 final verification

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Confirm framework version
        run: node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.3.6') process.exit(1); console.log('Next',p.dependencies.next)"
      - run: npx tsc --noEmit
      - name: Turbopack production build
        run: npm run build | tee /tmp/build.log
        env:
          PAYLOAD_SECRET: milestone-1-final-build
      - name: Ensure reference project is excluded from routes
        run: |
          if grep -q "Example aniiations from another project" /tmp/build.log; then
            echo "Reference project is still being compiled as application routes."
            exit 1
          fi
      - name: Turbopack bundle analysis
        run: npm run analyze
        env:
          PAYLOAD_SECRET: milestone-1-final-analyze
      - name: Report analyzer output
        run: |
          du -sh .next/diagnostics/analyze
          find .next/diagnostics/analyze -type f | wc -l
